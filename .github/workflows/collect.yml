name: 가격 수집

on:
  schedule:
    # 매일 20:10 UTC = 한국 시간 05:10 (GitHub 크론은 UTC 기준)
    #
    # 🔴 **UTC 자정에서 멀리 둔다** (BB36, 2026-09-20). `fetched_date` 는 UTC 날짜인데
    # GitHub 예약 실행은 1~2시간 늦게 시작한다. 예전 `10 22`는 실제 실행이 00:00Z 앞뒤로
    # 떨어져 라벨이 하루씩 흔들렸다 — 어떤 날은 같은 라벨로 두 번 돌아 앞 실행을 덮고
    # (broad_offers 는 INSERT OR REPLACE), 어떤 날은 라벨이 통째로 비었다(09-07·09-13).
    # 예외도 경고도 없이 `trend`·`obs_days`에 구멍이 났다.
    # 20:10 이면 지연이 3시간 반이어도 자정 전이다. 그래도 넘는 날은 아래 상태 점검이 잡는다.
    - cron: "10 20 * * *"
  #
  # M4 동안(T4b)에는 이 줄이 없었다 — 구형 저장소 크론과 둘 다 돌면 구독 알림이
  # 두 번 가기 때문이다(중복 방지 `alert_log`가 저장소마다 따로인 DB 안에 있다).
  # M5에서 구형 크론을 **먼저 끄고**(Actions 비활성) → 구형의 최신 DB를 인계한 뒤
  # → 여기를 되살렸다(2026-09-17). 순서가 바뀌면 그날 신형이 옛 DB로 한 번 돌아 덮는다.
  #
  # ⚠️ 구형 `promo-ticket-site`는 M6에서 private 으로 돌리는데, **private 이어도
  # Actions 는 돈다.** 그래서 M5에서 명시적으로 껐다 — 다시 켜지 말 것.

  workflow_dispatch:      # 손으로 돌리기 — 검증은 skip_side_effects=true 로
    inputs:
      skip_side_effects:
        description: "메일함·발송을 건드리지 않는다 (수동 검증용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 🔴 시크릿이 **레포가 아니라 `production` 환경**에 있다. 이 줄이 없으면
    # 에러가 아니라 **빈 값**이 들어가고, 수집 스텝이 `continue-on-error`라
    # **초록불로 끝난다.** 한 줄이 하루치 수집을 날린다.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집기 둘은 **서로 다른 API**를 쓴다(v3/prices_for_dates vs v2/prices/latest).
      # 하드 실패로 두면 한쪽 장애가 멀쩡한 다른 쪽까지 못 돌게 하고, 이미 모은
      # 행이 커밋 전에 버려져 30일 baseline에 영구 구멍이 난다.
      # 빈 산출물 배포는 하한선 방어(BB1)가 이미 막으므로, 여기선 계속 진행하고
      # 마지막 '상태 점검'이 잡을 실패로 표시한다 — 데이터는 살리고 알림은 받는다.
      - name: 가격 수집 (노선 상세)
        id: prices
        continue-on-error: true
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python collector/fetch_prices.py

      - name: 광역 수집 (발견 피드)
        id: breadth
        continue-on-error: true
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python collector/fetch_breadth.py

      - name: 특가 판정
        id: detect
        continue-on-error: true   # 파생 산출물이라 실패가 수집분을 버릴 이유가 없다
        run: python collector/detect_deals.py | tee data/deals_latest.txt

      - name: 프로모션 메일 수집
        id: mail
        # 🔴 `mail_ingest` 는 메일함을 **소비한다** — `select("INBOX")` 가 readonly 가
        # 아니고 `fetch(RFC822)` 가 PEEK 가 아니라 **\Seen 이 붙는다.** 다음 사람의
        # `UNSEEN` 검색에서 사라진다. 구형 크론이 아직 galmal.kr 을 서빙하므로
        # 여기서 읽어버리면 **라이브 사이트가 그날 딜을 잃는다.**
        # 예약 실행(`inputs` 없음)에서는 null != true 라 **그대로 돈다.**
        if: inputs.skip_side_effects != true
        continue-on-error: true   # 메일 실패가 가격 수집 커밋을 막지 않도록
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: python collector/mail_ingest.py

      - name: 메일 LLM 파싱 (Claude API, Haiku)
        id: parse
        # Claude API 과금이 붙는다. 수동 검증에 태울 이유가 없다.
        # 예약 실행(`inputs` 없음)에서는 null != true 라 **그대로 돈다.**
        if: inputs.skip_side_effects != true
        continue-on-error: true   # 파싱 실패가 나머지 파이프라인을 막지 않도록
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements.txt
          python collector/parse_mail.py

      - name: 구독 알림 발송
        id: alerts
        # 구독자에게 **실제로 메일이 나간다.** 중복 방지(`alert_log`)는 저장소마다
        # 따로라 양쪽이 각자 "처음"인 줄 알고 같은 딜을 두 번 보낼 수 있다.
        # 예약 실행(`inputs` 없음)에서는 null != true 라 **그대로 돈다.**
        if: inputs.skip_side_effects != true
        continue-on-error: true   # 발송 실패가 나머지 파이프라인을 막지 않도록
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          TP_MARKER: ${{ secrets.TP_MARKER }}
          TP_TRIP_TRS: ${{ secrets.TP_TRIP_TRS }}
          TP_TRIP_P: ${{ secrets.TP_TRIP_P }}
          TP_TRIP_CAMPAIGN: ${{ secrets.TP_TRIP_CAMPAIGN }}
          # 메일 본문이 사이트로 링크한다. 백엔드 코드는 주소를 모른다(P2) —
          # 배포 설정에서 받는다. 비면 send_alerts 가 멈춘다(링크 죽은 메일 방지).
          SITE_URL: ${{ vars.SITE_URL || 'https://galmal.kr' }}
        run: python collector/send_alerts.py

      - name: v1 API 발행 (백엔드)
        id: build
        continue-on-error: true   # 실패해도 data/는 커밋한다(아래 커밋 스텝 참조)
        env:
          TP_MARKER: ${{ secrets.TP_MARKER }}
          TP_TRIP_TRS: ${{ secrets.TP_TRIP_TRS }}
          TP_TRIP_P: ${{ secrets.TP_TRIP_P }}
          TP_TRIP_CAMPAIGN: ${{ secrets.TP_TRIP_CAMPAIGN }}
        run: python collector/publish.py

      # 화면은 **프론트 저장소**(`galmal-frontend`)가 만든다. 여기엔 `site/`가 없다.
      #
      # M3에서는 같은 저장소에 둘 다 있어서 이 자리에서 `site/build.py`를 불렀다.
      # 분리 후에는 발행이 끝나면 **프론트에 신호를 보내** 그쪽이 굽는다 —
      # 그 배선(`repository_dispatch`)은 **T6**에서 붙인다. 그때까지 이 저장소는
      # v1 JSON만 만들고 끝난다(구형 저장소가 아직 galmal.kr을 서빙한다).

      - name: 데이터·사이트 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 발행이 실패했으면 docs/는 커밋하지 않는다 — 반쯤 쓰인
          # 산출물이 배포되면 안 된다. 대신 수집한 데이터는 남겨 이력에 구멍을 내지 않는다.
          # T3 전에는 옛 경로가 HTML을 먼저 써서 화면 실패 시에도 배포할 것이 남아 있었다.
          # 이제는 화면을 만드는 게 프론트 경로 하나뿐이라 **둘 다** 성공해야 한다.
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add docs/
          else
            echo "::warning::v1 발행 실패 — data/만 커밋하고 docs/v1 은 어제 것을 유지한다"
          fi
          # 라벨은 KST — 읽는 사람이 전부 한국 시간으로 산다(BB13).
          # 데이터 필드(fetched_date)는 기계가 빼는 값이라 UTC 그대로다.
          git commit -m "collect: $(TZ=Asia/Seoul date '+%Y-%m-%d')" || echo "변경 없음"

          # push 전에 원격을 당긴다(BB20). 세 세션이 main에 push하므로 체크아웃과
          # push 사이에 원격이 움직일 수 있고, 그러면 push가 거부돼 **그날 수집분이
          # 통째로 버려진다**. 2026-09-01에 실제로 발생했다.
          #
          # rebase를 쓰는 이유: 생성물(prices.db·docs/)은 우리가 방금 만든 게 최신이므로
          # 원격 커밋 위에 얹으면 된다. 충돌은 생성물에서만 날 수 있고, 그때는
          # 우리 것을 취한다 — 다음 크론이 어차피 다시 만든다.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push 거부됨 (시도 $attempt) — 원격을 당겨 다시 얹는다"
            git fetch origin main
            git rebase origin/main || {
              # ⚠️ rebase에서는 --ours/--theirs가 merge와 **반대**다.
              #    --ours  = 얹히는 대상(origin/main)
              #    --theirs = 지금 얹고 있는 내 커밋  ← 방금 만든 산출물
              # 여기서 --ours를 쓰면 오늘 수집분을 버린다.
              git checkout --theirs data/ docs/ 2>/dev/null || true
              git add data/ docs/
              git -c core.editor=true rebase --continue || git rebase --abort
            }
          done
          echo "::error::3회 시도 후에도 push 실패 — 오늘 수집분이 커밋되지 않았다"
          exit 1

      # v1 이 갱신됐으니 프론트에 **다시 구우라고 알린다** (M4 T6).
      #
      # 저장소가 갈린 뒤로 화면은 `galmal-frontend`가 만든다. 이 신호가 없으면
      # 프론트는 자기 저장소에 push 가 없는 한 안 굽고, **API 만 매일 새로워진다.**
      #
      # 🔴 마켓플레이스 액션(`peter-evans/repository-dispatch` 등)을 쓰지 않는다 —
      # 저장소 Actions 정책이 **GitHub 제작 액션만** 허용한다(M4 T0). `gh` 로 쏜다.
      #
      # ⚠️ `DISPATCH_TOKEN` 은 fine-grained 라 **`Contents: Read and write`** 가 필요하다.
      # **Actions 권한이 아니다** — Actions 만 주면 `403 Resource not accessible` 이고,
      # 그건 `continue-on-error` 아래서 **조용하다.** 그래서 아래 상태 점검이 이 스텝의
      # outcome 을 본다. 만료는 1년 뒤지만 **권한 오설정은 배선을 켜는 그날**이다.
      #
      # 🔴 **신호는 API가 방금 발행한 값을 실제로 서빙한 뒤에 보낸다** (2026-09-17 M5 실측).
      #
      #   02:45:25Z 발행·커밋 → 02:45:32Z 프론트가 신호 받고 시작 → 02:45:40Z 프론트가 API 를 받음
      #   → 02:46:09Z 백엔드 Pages 배포 완료   ← 29초 늦었다
      #
      # push 직후에 쏘면 프론트가 **매번 어제 API 로 굽는다.** 그리고 사이트 점검의
      # 「어제까지 허용」 관용 때문에 **경보는 매일 초록불**이다 — 사이트가 하루씩 영원히
      # 뒤처져도 아무도 모른다. 배선과 관용이 합쳐져 BB18 의 얼굴을 만들었다.
      #
      # ⚠️ 확인은 **캐시 우회 없이** 한다(`?t=` 안 붙임). Pages 는 `Cache-Control: max-age=600`
      # 이라 프론트가 받는 것도 CDN 캐시일 수 있다 — 우회하면 「나는 새 값을 봤다」가
      # 「프론트도 새 값을 본다」를 보장하지 않는다. **프론트가 보는 URL 그대로** 본다.
      # 최대 12분 기다린다(max-age 600초를 넘기려고). 그래도 안 오면 **신호를 안 보내고 실패**한다 —
      # 어제 데이터로 굽게 하느니 상태 점검이 빨간불을 켜게 하는 게 낫다.
      #
      # `client_payload.generated` 도 같이 보낸다. 프론트가 받은 API 값과 대조해
      # 캐시 엣지가 달라 어긋났는지 **받는 쪽에서** 확인할 수 있게 한다(필드 추가라 안전).
      - name: 프론트에 알림 (repository_dispatch)
        id: dispatch
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://galmal.kr' }}
        run: |
          want=$(python -c "import json; print(json.load(open('docs/v1/meta.json', encoding='utf-8'))['generated'])")
          url="$API_URL/v1/meta.json"
          got=""
          for i in $(seq 1 72); do
            got=$(curl -fsS --max-time 15 "$url" 2>/dev/null \
                  | python -c "import sys,json; print(json.load(sys.stdin)['generated'])" 2>/dev/null)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          if [ "$got" != "$want" ]; then
            echo "::error::$url 이 아직 새 데이터를 서빙하지 않는다 (기대 $want · 보이는 값 ${got:-없음}). 신호를 보내면 프론트가 어제 것으로 굽는다."
            exit 1
          fi
          echo "API 가 $want 를 서빙한다 — 신호를 보낸다"
          gh api -X POST repos/RYU-TOMI/galmal-frontend/dispatches \
            -f event_type=api-updated \
            -f "client_payload[generated]=$want"
          echo "galmal-frontend 에 api-updated 를 보냈다"

      # 커밋 **뒤**에 둔다 — 데이터는 먼저 남기고, 그다음에 잡을 실패로 표시한다.
      # continue-on-error 스텝은 실패해도 잡이 초록불이라 몇 주째 죽어 있어도
      # 아무도 몰랐다(BB18). 잡을 실패로 만들면 GitHub가 저장소 소유자에게 메일을 보낸다.
      - name: 상태 점검
        if: always()
        env:
          # 🔴 secrets 가 아니라 vars 다. secrets 면 로그에서 ***로 가려져
          # 「주소가 틀렸다」와 「배포가 멈췄다」를 구분할 수 없다.
          # 변수가 없으면 기본값 — M3 동안은 지금 저장소에 안 만들어도 된다.
          # M5에서 api.galmal.kr 로 **이 변수 하나만** 바꾼다.
          API_URL: ${{ vars.API_URL || 'https://galmal.kr' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://galmal.kr' }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
        run: |
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note "## 수집 결과 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          # 수집·판정·빌드까지 전부 continue-on-error가 됐으므로, 여기서 안 보면
          # 무엇이 죽어도 잡이 초록불로 끝난다 — BB18을 되돌리는 셈이다.
          for s in "노선 수집:${{ steps.prices.outcome }}"                    "광역 수집:${{ steps.breadth.outcome }}"                    "특가 판정:${{ steps.detect.outcome }}"                    "v1 발행:${{ steps.build.outcome }}"                    "메일 수집:${{ steps.mail.outcome }}"                    "메일 파싱:${{ steps.parse.outcome }}"                    "알림 발송:${{ steps.alerts.outcome }}"                    "프론트 알림:${{ steps.dispatch.outcome }}"; do
            name="${s%%:*}"; outcome="${s##*:}"
            if [ "$outcome" = "failure" ]; then
              note "- ❌ $name 실패"; fail=1
            else
              note "- ✅ $name ($outcome)"
            fi
          done
          if [ "${{ steps.build.outputs.preserved }}" = "true" ]; then
            note "- ⚠️ deals.json 갱신 안 함 (하한선 미달) — 사이트는 이전 딜을 계속 보여준다"
            fail=1
          fi
          # ── 실행 시각 점검 (BB36) ─────────────────────────────────────────
          # 예약 실행이 UTC 자정 ±1시간 안에서 돌면 `fetched_date` 라벨이 하루씩 흔들린다.
          # 예약을 20:10 으로 옮겨 지금은 멀지만, GitHub 지연이 다시 커지면 **조용히** 되돌아온다 —
          # 구멍은 예외 없이 난다. 그래서 가까워진 날 시끄럽게 만든다. 수동 실행은 보지 않는다.
          hour=$(date -u '+%H')
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" = "23" ] || [ "$hour" = "00" ]; }; then
            note "- ❌ 실행 시각: $(date -u '+%H:%M') UTC — 자정에 걸쳤다. fetched_date 라벨이 흔들린다(BB36). cron 을 더 앞으로 옮길 것"
            echo "::error::예약 실행이 UTC 자정 가까이에서 돌았다. 수집일에 구멍이 나거나 같은 날을 덮는다."
            fail=1
          fi
          # ── API 점검 (R1·R1b·R1c) ─────────────────────────────────────────
          # 무엇을 잡나: **배포가 멈춘 것**과 **주소가 틀린 것**.
          # 수집은 초록불인데 배포만 죽으면 아무도 모른다 — BB18이 그랬다.
          #
          # ⚠️ 「오늘 것인가」로 짜면 매일 헛실패한다. 이 스텝은 push 직후에 도는데
          #    Pages 배포가 ~25초 더 걸린다(실측) — 그 순간 라이브는 대개 **어제 것**이다.
          #    그래서 **어제까지는 통과**시키고 **그보다 오래되면 실패**한다.
          #    배포가 진짜 멈추면 다음 날 걸린다. 몇 주를 모르던 것보다 훨씬 낫다.
          url="$API_URL/v1/meta.json"
          meta=""
          for wait in 0 30 45; do
            [ "$wait" = 0 ] || sleep "$wait"
            meta=$(curl -fsS --max-time 20 "$url" 2>/dev/null) && break
          done
          if [ -z "$meta" ]; then
            # 🔴 부른 URL을 그대로 찍는다. 값에 \r 이 섞여 있어도 여기서 보인다 —
            #    2026-09-15에 API_URL 값 끝에 \r\n 이 붙어 있던 적이 있다.
            note "- ❌ API 점검: 못 받음 — $url"
            echo "::error::$url 을 받지 못했다. 주소가 틀렸거나 배포가 죽었다."
            fail=1
          else
            served=$(printf '%s' "$meta" | python -c "import sys,json; print(json.load(sys.stdin)['generated'][:10])")
            addr=$(printf '%s' "$meta" | python -c "import sys,json; print(json.load(sys.stdin)['subscribe']['address'])")
            today=$(TZ=Asia/Seoul date '+%Y-%m-%d')
            yday=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')
            if [ "$served" = "$today" ]; then
              note "- ✅ API 점검: 오늘 것이 서빙 중 ($served)"
            elif [ "$served" = "$yday" ]; then
              note "- ✅ API 점검: 어제 것 ($served) — 배포 반영 대기로 본다"
            else
              note "- ❌ API 점검: **$served** 로 멈춰 있다 — $url"
              echo "::error::배포가 멈췄다. $url 이 $served 를 서빙한다(오늘 $today)."
              fail=1
            fi
            # 구독 메일함 대조 (BB32) — 시크릿이 있는 유일한 자리라 여기서만 볼 수 있다.
            # 갈리면 사용자가 보낸 구독 메일을 **아무도 읽지 않는다.** 반송조차 안 온다.
            if [ -n "$MAIL_ADDRESS" ] && [ "$addr" != "$MAIL_ADDRESS" ]; then
              note "- ❌ 구독 주소 불일치: 화면은 **$addr** 인데 우리가 읽는 메일함은 다르다"
              echo "::error::meta.subscribe.address($addr) != MAIL_ADDRESS. 구독 메일을 아무도 안 읽는다."
              fail=1
            elif [ -n "$MAIL_ADDRESS" ]; then
              note "- ✅ 구독 주소: 우리가 읽는 메일함과 같다"
            fi
            # ── 사이트 점검 (T6b) ──────────────────────────────────────────
            # 🔴 저장소가 갈린 뒤 **API 점검만으로는 R1 을 못 본다.** 프론트가 몇 주째
            # 안 구워져도 백엔드 자기 API 는 매일 신선하기 때문이다 — 매일 초록불이고
            # BB18 재발 조건 그대로다. 그래서 **사이트가 API 를 따라오는지**를 따로 본다.
            #
            # 두 값의 일치를 본다 — 절대값을 기대하지 않는다. 프론트가 `build.json` 에
            # `meta.generated` 를 **가공 없이 그대로** 복사한다(프론트 확인).
            #
            # ⚠️ 관용은 API 점검과 같다(오늘/어제). dispatch 직후엔 프론트가 아직 굽는
            # 중이라 **그 순간 사이트는 항상 한 주기 뒤처져 있다.** 정확히 같기를
            # 기대하면 매일 헛실패하고, 매일 실패하는 점검은 무시당한다.
            site_url="$SITE_URL/build.json"
            site=""
            for wait in 0 30 45; do
              [ "$wait" = 0 ] || sleep "$wait"
              site=$(curl -fsS --max-time 20 "$site_url" 2>/dev/null) && break
            done
            if [ -z "$site" ]; then
              # 🔴 「못 받음」은 통과가 아니라 실패다. 여기서 넘어가면 이 점검은
              # 아무것도 안 막는다 — build.json 위치·Pages 루트·SITE_URL 오타가
              # 전부 404 로 온다.
              note "- ❌ 사이트 점검: 못 받음 — $site_url"
              echo "::error::$site_url 을 받지 못했다. 주소가 틀렸거나 프론트 배포가 죽었다."
              fail=1
            else
              site_api=$(printf '%s' "$site" | python -c "import sys,json; print(json.load(sys.stdin)['api_generated'][:10])")
              if [ "$site_api" = "$today" ] || [ "$site_api" = "$yday" ]; then
                note "- ✅ 사이트 점검: API 를 따라오고 있다 (site $site_api / api $served)"
              else
                note "- ❌ 사이트 점검: 사이트가 **$site_api** 에 멈춰 있다 (api $served) — $site_url"
                echo "::error::프론트가 다시 굽지 않는다. dispatch 권한·PAT·프론트 워크플로를 볼 것."
                fail=1
              fi
            fi
          fi

          [ "$fail" = "0" ] || {
            echo "::error::수집은 끝났고 데이터도 커밋됐지만 위 항목이 실패했다. 요약을 볼 것."
            exit 1
          }
