name: 가격 수집

on:
  schedule:
    # 매일 22:10 UTC = 한국 시간 07:10 (GitHub 크론은 UTC 기준)
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집기 둘은 **서로 다른 API**를 쓴다(v3/prices_for_dates vs v2/prices/latest).
      # 하드 실패로 두면 한쪽 장애가 멀쩡한 다른 쪽까지 못 돌게 하고, 이미 모은
      # 행이 커밋 전에 버려져 30일 baseline에 영구 구멍이 난다.
      # 빈 산출물 배포는 하한선 방어(BB1)가 이미 막으므로, 여기선 계속 진행하고
      # 마지막 '상태 점검'이 잡을 실패로 표시한다 — 데이터는 살리고 알림은 받는다.
      - name: 가격 수집 (노선 상세)
        id: prices
        continue-on-error: true
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python collector/fetch_prices.py

      - name: 광역 수집 (발견 피드)
        id: breadth
        continue-on-error: true
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python collector/fetch_breadth.py

      - name: 특가 판정
        id: detect
        continue-on-error: true   # 파생 산출물이라 실패가 수집분을 버릴 이유가 없다
        run: python collector/detect_deals.py | tee data/deals_latest.txt

      - name: 프로모션 메일 수집
        id: mail
        continue-on-error: true   # 메일 실패가 가격 수집 커밋을 막지 않도록
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: python collector/mail_ingest.py

      - name: 메일 LLM 파싱 (Claude API, Haiku)
        id: parse
        continue-on-error: true   # 파싱 실패가 나머지 파이프라인을 막지 않도록
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements.txt
          python collector/parse_mail.py

      - name: 구독 알림 발송
        id: alerts
        continue-on-error: true   # 발송 실패가 나머지 파이프라인을 막지 않도록
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          TP_MARKER: ${{ secrets.TP_MARKER }}
          TP_TRIP_TRS: ${{ secrets.TP_TRIP_TRS }}
          TP_TRIP_P: ${{ secrets.TP_TRIP_P }}
          TP_TRIP_CAMPAIGN: ${{ secrets.TP_TRIP_CAMPAIGN }}
        run: python collector/send_alerts.py

      - name: 웹 피드 생성
        id: build
        continue-on-error: true   # 실패해도 data/는 커밋한다(아래 커밋 스텝 참조)
        env:
          TP_MARKER: ${{ secrets.TP_MARKER }}
          TP_TRIP_TRS: ${{ secrets.TP_TRIP_TRS }}
          TP_TRIP_P: ${{ secrets.TP_TRIP_P }}
          TP_TRIP_CAMPAIGN: ${{ secrets.TP_TRIP_CAMPAIGN }}
        run: python collector/build_site.py

      # M3 T1 — 화면을 프론트 경로(site/build.py)가 그리게 한다.
      #
      # 옛 경로(build_site.py)는 아직 HTML도 쓴다(T3에서 걷어낸다). 그래서 새 경로를
      # 그냥 docs/ 에 덮어쓰면 **새 경로가 빠뜨린 파일을 옛 파일이 가려준다** — 스위치가
      # 된 것처럼 보이지만 검증이 안 된다. 그래서 새 경로는 임시 폴더에 그리고,
      # **운영 러너에서 매일** 두 경로를 대조한 뒤에만 docs/ 로 옮긴다(T2 관찰 기간).
      #
      # 다르면: 새 경로 산출물은 버리고 옛 경로가 쓴 docs/ 를 그대로 배포한다(사이트는
      # 신선하게 유지) + 상태 점검이 잡을 실패로 표시해 메일이 온다. 되돌릴 게 없다.
      #
      # ⚠️ 차이가 떴을 때 — 먼저 **무엇이** 달랐는지로 가른다:
      #
      # - 「언제 가면 싼가」 문장 하나가 사라짐 → BB28 임계(새 노선이 들어온 날). 새 경로가
      #   **더 맞다**. 버그 아님.
      # - 🔴 노선 36장 + sitemap 이 **한꺼번에**, `dateModified`·`lastmod` 한 줄씩만 다름 →
      #   **버그다.** 새 경로가 날짜를 KST로 잘랐다(`generated[:10]`). 기계용 날짜는 UTC다
      #   (BB17). 크론은 UTC 자정에 걸쳐 돈다 — 2026-09 초 4일 연속 23:46~23:58 UTC.
      #   프론트 `site/route.py` `machine_date()` 로 고친다(2026-09-11 발견).
      #   처음엔 이것도 "새 경로가 더 맞다"로 적었는데 **틀렸다**.
      #
      # T3에서 옛 HTML이 사라지면 대조할 상대가 없어지므로 이 스텝은 한 줄로 줄어든다.
      - name: 화면 생성 (프론트 경로 · 옛 경로와 대조)
        id: site
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          out="$(mktemp -d)"
          python site/build.py --api docs/v1 --out "$out"

          # 파일 집합부터 — 새 경로가 노선을 빠뜨리면 여기서 걸린다
          if ! diff <(cd docs/routes && ls) <(cd "$out/routes" && ls) >/dev/null; then
            echo "::error::노선 파일 목록이 다르다"
            diff <(cd docs/routes && ls) <(cd "$out/routes" && ls) | head -20
            exit 1
          fi
          bad=""
          for f in index.html sitemap.xml robots.txt $(cd "$out" && ls routes/*.html); do
            cmp -s "docs/$f" "$out/$f" || bad="$bad $f"
          done
          if [ -n "$bad" ]; then
            echo "::error::옛 경로와 새 경로의 화면이 다르다:$bad"
            echo "옛 경로 산출물을 그대로 배포한다. 차이가 잠복 변경(위 주석)인지 확인할 것."
            exit 1
          fi
          cp "$out/index.html" "$out/sitemap.xml" "$out/robots.txt" docs/
          cp "$out"/routes/*.html docs/routes/
          echo "새 경로 화면 $(ls "$out"/routes/*.html | wc -l)+3개 — 옛 경로와 동일, 배포"

      - name: 데이터·사이트 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 사이트 생성이 실패했으면 docs/는 커밋하지 않는다 — 반쯤 쓰인 산출물이
          # 배포되면 안 된다. 대신 수집한 데이터는 남겨 이력에 구멍을 내지 않는다.
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add docs/
          else
            echo "::warning::사이트 생성 실패 — data/만 커밋하고 docs/는 어제 것을 유지한다"
          fi
          # 라벨은 KST — 읽는 사람이 전부 한국 시간으로 산다(BB13).
          # 데이터 필드(fetched_date)는 기계가 빼는 값이라 UTC 그대로다.
          git commit -m "collect: $(TZ=Asia/Seoul date '+%Y-%m-%d')" || echo "변경 없음"

          # push 전에 원격을 당긴다(BB20). 세 세션이 main에 push하므로 체크아웃과
          # push 사이에 원격이 움직일 수 있고, 그러면 push가 거부돼 **그날 수집분이
          # 통째로 버려진다**. 2026-09-01에 실제로 발생했다.
          #
          # rebase를 쓰는 이유: 생성물(prices.db·docs/)은 우리가 방금 만든 게 최신이므로
          # 원격 커밋 위에 얹으면 된다. 충돌은 생성물에서만 날 수 있고, 그때는
          # 우리 것을 취한다 — 다음 크론이 어차피 다시 만든다.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push 거부됨 (시도 $attempt) — 원격을 당겨 다시 얹는다"
            git fetch origin main
            git rebase origin/main || {
              # ⚠️ rebase에서는 --ours/--theirs가 merge와 **반대**다.
              #    --ours  = 얹히는 대상(origin/main)
              #    --theirs = 지금 얹고 있는 내 커밋  ← 방금 만든 산출물
              # 여기서 --ours를 쓰면 오늘 수집분을 버린다.
              git checkout --theirs data/ docs/ 2>/dev/null || true
              git add data/ docs/
              git -c core.editor=true rebase --continue || git rebase --abort
            }
          done
          echo "::error::3회 시도 후에도 push 실패 — 오늘 수집분이 커밋되지 않았다"
          exit 1

      # 커밋 **뒤**에 둔다 — 데이터는 먼저 남기고, 그다음에 잡을 실패로 표시한다.
      # continue-on-error 스텝은 실패해도 잡이 초록불이라 몇 주째 죽어 있어도
      # 아무도 몰랐다(BB18). 잡을 실패로 만들면 GitHub가 저장소 소유자에게 메일을 보낸다.
      - name: 상태 점검
        if: always()
        run: |
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note "## 수집 결과 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          # 수집·판정·빌드까지 전부 continue-on-error가 됐으므로, 여기서 안 보면
          # 무엇이 죽어도 잡이 초록불로 끝난다 — BB18을 되돌리는 셈이다.
          for s in "노선 수집:${{ steps.prices.outcome }}"                    "광역 수집:${{ steps.breadth.outcome }}"                    "특가 판정:${{ steps.detect.outcome }}"                    "사이트 생성:${{ steps.build.outcome }}"                    "화면 생성(새 경로):${{ steps.site.outcome }}"                    "메일 수집:${{ steps.mail.outcome }}"                    "메일 파싱:${{ steps.parse.outcome }}"                    "알림 발송:${{ steps.alerts.outcome }}"; do
            name="${s%%:*}"; outcome="${s##*:}"
            if [ "$outcome" = "failure" ]; then
              note "- ❌ $name 실패"; fail=1
            else
              note "- ✅ $name ($outcome)"
            fi
          done
          if [ "${{ steps.build.outputs.preserved }}" = "true" ]; then
            note "- ⚠️ deals.json 갱신 안 함 (하한선 미달) — 사이트는 이전 딜을 계속 보여준다"
            fail=1
          fi
          [ "$fail" = "0" ] || {
            echo "::error::수집은 끝났고 데이터도 커밋됐지만 위 항목이 실패했다. 요약을 볼 것."
            exit 1
          }
